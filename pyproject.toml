[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trail"
version = "0.0.0"
description = "Traceable question answering over academic paper PDFs"
requires-python = ">=3.12"
dependencies = [
    "mineru>=4.0,<5",
    "numpy",
    "sentence-transformers>=3,<6",
    "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
